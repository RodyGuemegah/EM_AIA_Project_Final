services:
  minio:
     image: minio/minio:latest
     container_name: safran-minio
     ports:
       - "9000:9000"
       - "9001:9001"
     volumes: 
        - ./data/minio:/data
     environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
     command: server /data --console-address ":9001"